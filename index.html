<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ennyn Durin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #05070a;
            color: #d1d5db;
            font-family: 'Cinzel', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        /* Doors Arch Frame */
        .door-container {
            position: relative;
            width: 320px;
            height: 440px;
            margin: 0 auto 40px;
            border: 2px solid rgba(147, 197, 253, 0.15);
            border-radius: 160px 160px 0 0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(147, 197, 253, 0.05);
            transition: all 1.2s ease-in-out;
        }

        .door-container.unlocked {
            border-color: #93c5fd;
            box-shadow: inset 0 0 60px rgba(147, 197, 253, 0.3), 0 0 40px rgba(147, 197, 253, 0.5);
            background: rgba(147, 197, 253, 0.03);
        }

        /* The Runes Inscription Inside the Arch */
        .elvish-inscription {
            font-size: 1.3rem;
            color: #38bdf8;
            opacity: 0.35;
            text-shadow: 0 0 3px #38bdf8;
            padding: 25px;
            line-height: 2;
            letter-spacing: 2px;
            transition: opacity 1.2s ease, text-shadow 1.2s ease;
            font-weight: 700;
        }

        .door-container.unlocked .elvish-inscription {
            opacity: 1;
            text-shadow: 0 0 12px #93c5fd, 0 0 25px #38bdf8;
        }

        /* Input Controls */
        .input-group {
            position: relative;
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            background-color: #0b1329;
            border: 1px solid #1e293b;
            color: #f8fafc;
            padding: 12px 18px;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            border-radius: 4px;
            outline: none;
            text-align: center;
            transition: border-color 0.4s, box-shadow 0.4s;
            width: 240px;
            letter-spacing: 2px;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        button {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 12px 20px;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        button.hidden-btn {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9);
        }

        button:hover {
            background-color: #1e293b;
            border-color: #64748b;
            color: #f8fafc;
        }

        /* Flying Letter Animation */
        .flying-letter {
            position: absolute;
            color: #38bdf8;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            pointer-events: none;
            animation: flyAway 1.2s forwards ease-in-out;
            text-shadow: 0 0 8px #38bdf8;
        }

        @keyframes flyAway {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(120px, -180px) rotate(45deg) scale(1.5);
            }
        }

        /* Status Message */
        #message {
            min-height: 24px;
            font-size: 0.95rem;
            color: #64748b;
            transition: color 0.5s ease;
        }

        #message.success {
            color: #38bdf8;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Arch with "SPEAK FRIEND AND ENTER" as the inscription -->
        <div class="door-container" id="doors">
            <div class="elvish-inscription">
                SPEAK FRIEND AND ENTER
            </div>
        </div>

        <form id="riddle-form" onsubmit="checkIncantation(event)">
            <div class="input-group" id="inputContainer">
                <input type="text" id="incantation" autocomplete="off" autofocus oninput="handleInput(event)">
                <button type="submit" id="speakBtn">Speak</button>
            </div>
        </form>

        <div id="message"></div>
    </div>

    <script>
        function handleInput(event) {
            const input = event.target;
            const rawValue = input.value;
            const speakBtn = document.getElementById('speakBtn');
            let resultChars = [];

            for (let i = 0; i < rawValue.length; i++) {
                let char = rawValue[i];

                // Check if typed letter is 'i' or 'I'
                if (char === 'i' || char === 'I') {
                    // Trigger flyaway specifically for 'i'
                    triggerFlyaway(char);
                    // Skip adding 'i' to the result string
                    continue;
                }

                // If lowercase 'l', render as lowercase 'l' (same vertical bar visual as upper 'I')
                if (char === 'l') {
                    resultChars.push('l');
                } else {
                    // Force all other letters to uppercase
                    resultChars.push(char.toUpperCase());
                }
            }

            // Reconstruct value
            input.value = resultChars.join('');

            // Hide speak button when length reaches 6
            if (input.value.length >= 6) {
                speakBtn.classList.add('hidden-btn');
            } else {
                speakBtn.classList.remove('hidden-btn');
            }
        }

        function triggerFlyaway(char) {
            const container = document.getElementById('inputContainer');
            const flyingElem = document.createElement('span');
            flyingElem.className = 'flying-letter';
            flyingElem.textContent = char;

            flyingElem.style.left = '40%';
            flyingElem.style.top = '10px';

            container.appendChild(flyingElem);

            setTimeout(() => {
                flyingElem.remove();
            }, 1200);
        }

        async function checkIncantation(event) {
            event.preventDefault();
            const input = document.getElementById('incantation').value;
            const message = document.getElementById('message');
            const doors = document.getElementById('doors');

            try {
                const response = await fetch('/api/verify-doors', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ incantation: input })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    doors.classList.add('unlocked');
                    message.className = 'success';
                    message.textContent = 'The doors swing silently open...';
                    
                    setTimeout(() => {
                        window.location.href = result.redirect;
                    }, 1500);
                } else {
                    doors.classList.remove('unlocked');
                    message.className = '';
                    message.textContent = result.message || 'The stone remains silent.';
                }
            } catch (err) {
                message.textContent = 'An error occurred while speaking to the stone.';
            }
        }
    </script>
</body>
</html>
